<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users List</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #121212; color: #fff; }
        h1 { color: #4caf50; }
        ul { list-style: none; padding: 0; }
        li { background: #1e1e1e; padding: 1rem; margin-bottom: 0.5rem; border-radius: 4px; }
        .email { color: #888; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>Users</h1>
    {% if users.is_empty() %}
        <p>No users found.</p>
    {% else %}
        <ul>
            {% for user in users %}
                <li>
                    <strong>{{ user.name }}</strong>
                    <br>
                    <span class="email">{{ user.email }}</span>
                </li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
