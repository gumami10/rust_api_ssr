{% extends "base.html" %}

{% block title %}New User{% endblock %}

{% block content %}
    <section class="mx-auto max-w-2xl space-y-6">
        <div class="rounded-3xl border border-white/10 bg-slate-900/75 p-6 shadow-glow shadow-slate-950/40 sm:p-8">
            <p class="text-sm font-semibold uppercase tracking-[0.3em] text-cyan-300/80">Create account</p>
            <h1 class="mt-3 text-4xl font-black tracking-tight text-white">New User</h1>
            <p class="mt-4 text-base leading-7 text-slate-300">Passwords are required so the user can log into chat.</p>
        </div>

        <div class="rounded-3xl border border-white/10 bg-slate-900/75 p-6 shadow-lg shadow-slate-950/25 sm:p-8">
            {% include "users/_form.html" %}
        </div>
    </section>

    <script type="module">
        import { faker } from "https://esm.sh/@faker-js/faker@9";

        const generators = {
            name: () => faker.person.fullName(),
            email: () => faker.internet.email(),
            password: () => faker.internet.password({ length: 16 }),
        };

        const dispatchValueChange = (input) => {
            input.dispatchEvent(new Event("input", { bubbles: true }));
            input.dispatchEvent(new Event("change", { bubbles: true }));
        };

        // Individual field fill buttons
        document.querySelectorAll("[data-faker-fill]").forEach((button) => {
            button.addEventListener("click", () => {
                const targetId = button.getAttribute("data-faker-target");
                const input = targetId ? document.getElementById(targetId) : null;

                if (!input) {
                    return;
                }

                const generator = generators[targetId];

                if (!generator) {
                    return;
                }

                input.value = generator();
                dispatchValueChange(input);
                input.focus();
            });
        });

        // Fill-all button: auto-generate every sign up field at once
        const fillAllBtn = document.getElementById("fill-all-fields");
        if (fillAllBtn) {
            fillAllBtn.addEventListener("click", () => {
                for (const [fieldId, generator] of Object.entries(generators)) {
                    const input = document.getElementById(fieldId);
                    if (input) {
                        input.value = generator();
                        dispatchValueChange(input);
                    }
                }
            });
        }
    </script>
{% endblock %}
